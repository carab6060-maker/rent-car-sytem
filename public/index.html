<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Car Rental Management System — Manage cars, customers, rentals, and payments efficiently." />
  <title>Car Rental Management System</title>
  <link rel="stylesheet" href="index.css?v=6" />
  <link rel="icon" type="image/png" href="/images/logo.png?v=2" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img src="/images/logo.png?v=2" alt="Logo" class="brand-icon" id="sidebarLogo" />
      <div class="brand-text-wrapper">
        <span class="brand-title">CarRent SaaS</span>
        <span class="brand-company" id="brandCompany">Loading...</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a href="#" class="nav-item active" data-page="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span>Dashboard</span>
      </a>
      <a href="#" class="nav-item" data-page="cars">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13" rx="2"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
        <span>Cars</span>
      </a>
      <a href="#" class="nav-item" data-page="customers">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Customers</span>
      </a>
      <a href="#" class="nav-item" data-page="rentals">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        <span>Rentals</span>
      </a>
      <a href="#" class="nav-item" data-page="payments">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        <span>Payments</span>
      </a>
      <a href="#" class="nav-item" data-page="expenses">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1-2-1z"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="12" y2="14"/></svg>
        <span>Expenses</span>
      </a>
      <!-- Manager-only: Users nav item (hidden by default, shown via JS) -->
      <a href="#" class="nav-item nav-item-manager" data-page="users" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/><line x1="19" y1="8" x2="23" y2="8"/><line x1="21" y1="6" x2="21" y2="10"/></svg>
        <span>Users</span>
      </a>
      <!-- SuperAdmin-only: Companies nav item -->
      <a href="#" class="nav-item nav-item-superadmin" data-page="companies" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/><line x1="9" y1="9" x2="9" y2="9.01"/><line x1="9" y1="13" x2="9" y2="13.01"/><line x1="9" y1="17" x2="9" y2="17.01"/></svg>
        <span>Companies</span>
      </a>
    </nav>

    <!-- Sidebar bottom: user info + logout -->
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-user-avatar" id="sidebarAvatar">?</div>
        <div class="sidebar-user-info">
          <span class="sidebar-user-name" id="sidebarUserName">Loading…</span>
          <span class="sidebar-user-role" id="sidebarUserRole"></span>
        </div>
      </div>
      <button class="btn-logout" id="logoutBtn" title="Sign out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Logout
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content" id="mainContent">

    <!-- Top Bar -->
    <header class="topbar">
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <h1 class="page-title" id="pageTitle">Dashboard</h1>
      <div class="topbar-user">
        <!-- Active Company Badge (single company, no dropdown) -->
        <div class="company-active-badge" id="companyBadgeWrapper">
          <span class="badge-label">Company:</span>
          <span class="badge-company-name" id="topbarCompanyName">Loading...</span>
        </div>
        <span class="topbar-role-badge" id="topbarRoleBadge"></span>
        <span class="topbar-user-name" id="topbarUserName"></span>
      </div>
    </header>

    <!-- Page Container -->
    <div class="page-container" id="pageContainer">
      <!-- Pages are rendered here by JS -->
    </div>
  </main>

  <!-- Modal Overlay -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">Title</h2>
        <button class="modal-close" id="modalClose" aria-label="Close modal">&times;</button>
      </div>
      <div class="modal-body" id="modalBody">
        <!-- Form content injected by JS -->
      </div>
    </div>
  </div>

  <!-- Confirm Dialog -->
  <div class="modal-overlay" id="confirmOverlay">
    <div class="modal confirm-modal">
      <div class="modal-header">
        <h2 class="modal-title">Confirm Delete</h2>
        <button class="modal-close" id="confirmClose" aria-label="Close confirm">&times;</button>
      </div>
      <div class="modal-body">
        <p id="confirmMessage">Are you sure you want to delete this item?</p>
        <div class="confirm-actions">
          <button class="btn btn-secondary" id="confirmCancel">Cancel</button>
          <button class="btn btn-danger" id="confirmOk">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Printable Document Modal (Agreement & Receipt) -->
  <div class="modal-overlay print-modal-overlay" id="printModalOverlay">
    <div class="modal print-modal" id="printModal">
      <div class="print-modal-toolbar">
        <div class="print-toolbar-left">
          <span class="print-toolbar-title" id="printDocTitle">Document Preview</span>
        </div>
        <div class="print-toolbar-actions">
          <button class="btn btn-primary" onclick="window.print()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
            <span>Print / Save PDF</span>
          </button>
          <button class="btn btn-secondary" id="printModalCloseBtn" onclick="closePrintModal()">Close</button>
        </div>
      </div>
      <div class="print-modal-body" id="printModalBody">
        <!-- Printable document injected by JS -->
      </div>
    </div>
  </div>

  <script src="chart.min.js"></script>
  <script src="app.js?v=6"></script>
</body>
</html>
